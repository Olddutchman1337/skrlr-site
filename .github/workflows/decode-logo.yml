name: decode-logo
on:
  push:
    branches: [main]
    paths: ['assets/skrlr-logo.b64.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode logo from base64 parts
        run: |
          set -e
          for i in 1 2 3; do
            if [ ! -f assets/skrlr-logo.b64.part$i ]; then echo "part$i missing, waiting for remaining parts"; exit 0; fi
          done
          cat assets/skrlr-logo.b64.part1 assets/skrlr-logo.b64.part2 assets/skrlr-logo.b64.part3 | tr -d '\n\r ' | base64 -d > assets/skrlr-logo.jpg
          echo "3b08a1fbe4726e9f5056faa1a1fbed04ca09632102324107cc078187d0b3af9e  assets/skrlr-logo.jpg" | sha256sum -c -
          git rm -q assets/skrlr-logo.b64.part1 assets/skrlr-logo.b64.part2 assets/skrlr-logo.b64.part3
          git add assets/skrlr-logo.jpg
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -m "Add Skrlr Games logo (decoded from base64)"
          git push
